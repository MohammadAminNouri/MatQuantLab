name: Run MatQuantLab Research Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repair broken one-line project files
        run: |
          cat > requirements.txt <<'EOF'
          pandas>=2.2
          numpy>=1.26
          scipy>=1.11
          scikit-learn>=1.4
          matplotlib>=3.8
          yfinance>=0.2.40
          EOF

          cat > pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=68"]
          build-backend = "setuptools.build_meta"
          
          [project]
          name = "matquantlab"
          version = "0.3.0"
          description = "Critical materials alpha research lab using Python, ML, commodities, macro, and industrial equities."
          requires-python = ">=3.10"
          
          [tool.setuptools.packages.find]
          where = ["src"]
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write standalone ML research pipeline
        run: |
          mkdir -p scripts outputs/figures data/processed
          cat > scripts/github_research_pipeline.py <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import warnings
          warnings.filterwarnings('ignore')
          
          import numpy as np
          import pandas as pd
          import matplotlib.pyplot as plt
          from scipy.stats import spearmanr
          from sklearn.ensemble import RandomForestRegressor
          from sklearn.linear_model import Ridge
          from sklearn.metrics import mean_absolute_error, r2_score
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          
          ROOT = Path.cwd()
          OUT = ROOT / 'outputs'
          FIG = OUT / 'figures'
          DATA = ROOT / 'data' / 'processed'
          FIG.mkdir(parents=True, exist_ok=True)
          DATA.mkdir(parents=True, exist_ok=True)
          
          ASSETS = ['SPY','XLB','XME','COPX','PICK','ITA','XAR','XLI','VIS','PRNT','DDD','SSYS','MTLS','NNDM']
          COMMODITIES = ['HG=F','CL=F','NG=F','GC=F','SI=F','^VIX','^TNX','DX-Y.NYB']
          ALL_TICKERS = ASSETS + COMMODITIES
          
          
          def demo_prices() -> pd.DataFrame:
              dates = pd.bdate_range('2016-01-01', periods=2100)
              rng = np.random.default_rng(42)
              copper_shock = rng.normal(0, 0.012, len(dates))
              oil_shock = rng.normal(0, 0.014, len(dates))
              vix_shock = rng.normal(0, 0.02, len(dates))
              data = {}
              for t in COMMODITIES:
                  shock = rng.normal(0, 0.01, len(dates))
                  if t == 'HG=F': shock = copper_shock
                  if t == 'CL=F': shock = oil_shock
                  if t == '^VIX': shock = vix_shock
                  data[t] = 100 * np.exp(np.cumsum(shock))
              for i, t in enumerate(ASSETS):
                  beta_cu = 0.10 if t in ['XME','COPX','PICK','XLB'] else 0.03
                  beta_oil = -0.06 if t in ['ITA','XAR','PRNT'] else 0.02
                  beta_vix = -0.12 if t not in ['SPY'] else -0.08
                  noise = rng.normal(0, 0.012 + 0.001 * (i % 4), len(dates))
                  r = 0.00015 + beta_cu * np.roll(copper_shock, 5) + beta_oil * np.roll(oil_shock, 5) + beta_vix * np.roll(vix_shock, 2) + noise
                  data[t] = 100 * np.exp(np.cumsum(r))
              return pd.DataFrame(data, index=dates)
          
          
          def fetch_prices() -> pd.DataFrame:
              import os
              if os.environ.get("USE_DEMO") == "1":
                  return demo_prices()
              try:
                  import yfinance as yf
                  out = {}
                  for t in ALL_TICKERS:
                      try:
                          s = yf.download(t, start='2016-01-01', progress=False, auto_adjust=True, threads=False, timeout=8)['Close']
                          if isinstance(s, pd.DataFrame):
                              s = s.iloc[:, 0]
                          if s.dropna().shape[0] > 500:
                              out[t] = s.rename(t)
                      except Exception:
                          pass
                  prices = pd.concat(out.values(), axis=1).sort_index() if out else pd.DataFrame()
                  usable_assets = [c for c in ASSETS if c in prices.columns]
                  usable_comms = [c for c in COMMODITIES if c in prices.columns]
                  if len(usable_assets) >= 5 and len(usable_comms) >= 3:
                      return prices.ffill().dropna(how='all')
              except Exception:
                  pass
              print('Using synthetic demo data because live download was unavailable or incomplete.')
              return demo_prices()
          
          
          def zscore(s: pd.Series, window: int = 60) -> pd.Series:
              return (s - s.rolling(window).mean()) / s.rolling(window).std()
          
          
          def make_features(prices: pd.DataFrame) -> pd.DataFrame:
              rets = prices.pct_change()
              parts = []
              for t in [c for c in COMMODITIES if c in prices.columns]:
                  for w in [5, 20, 60]:
                      parts.append(zscore(prices[t].pct_change(w), 126).rename(f'shock_z_{w}d__{t}'))
              features = pd.concat(parts, axis=1)
              shock_cols = [c for c in features.columns if c.startswith('shock_z_20d')]
              if shock_cols:
                  cmsi = features[shock_cols].abs().mean(axis=1)
              else:
                  cmsi = rets.abs().mean(axis=1).rolling(20).mean()
              features['critical_materials_stress_index'] = zscore(cmsi, 126)
              return features.replace([np.inf, -np.inf], np.nan)
          
          
          def make_panel(prices: pd.DataFrame, features: pd.DataFrame, horizon: int = 20) -> pd.DataFrame:
              rows = []
              asset_cols = [c for c in ASSETS if c in prices.columns]
              for asset in asset_cols:
                  df = features.copy()
                  df['asset'] = asset
                  df['date'] = df.index
                  df['asset_mom_20'] = prices[asset].pct_change(20)
                  df['asset_mom_60'] = prices[asset].pct_change(60)
                  df['asset_vol_20'] = prices[asset].pct_change().rolling(20).std()
                  df['target_fwd_return'] = prices[asset].pct_change(horizon).shift(-horizon)
                  rows.append(df)
              panel = pd.concat(rows, axis=0, ignore_index=True)
              return panel.dropna(subset=['target_fwd_return'])
          
          
          def signal_decay(panel: pd.DataFrame, prices: pd.DataFrame, features: pd.DataFrame) -> pd.DataFrame:
              feature_candidates = [c for c in features.columns if 'shock_z_20d' in c][:8] + ['critical_materials_stress_index']
              records = []
              for feat in feature_candidates:
                  for h in [5, 20, 60]:
                      vals = []
                      for asset in [a for a in ASSETS if a in prices.columns]:
                          tmp = pd.DataFrame({'x': features[feat], 'y': prices[asset].pct_change(h).shift(-h)}).dropna()
                          if len(tmp) > 100:
                              ic = spearmanr(tmp['x'], tmp['y']).correlation
                              if np.isfinite(ic): vals.append(ic)
                      records.append({'feature': feat, 'horizon': f'{h}D', 'mean_ic': float(np.nanmean(vals)) if vals else np.nan})
              return pd.DataFrame(records)
          
          
          def train_models(panel: pd.DataFrame):
              excluded = {'date','asset','target_fwd_return'}
              feature_cols = [c for c in panel.columns if c not in excluded and pd.api.types.is_numeric_dtype(panel[c])]
              clean = panel[['date','asset','target_fwd_return'] + feature_cols].replace([np.inf,-np.inf], np.nan).dropna()
              dates = np.sort(clean['date'].unique())
              split = dates[int(len(dates)*0.70)]
              train = clean[clean['date'] < split]
              test = clean[clean['date'] >= split]
              models = {
                  'Ridge': make_pipeline(StandardScaler(), Ridge(alpha=5.0)),
                  'RidgeStrong': make_pipeline(StandardScaler(), Ridge(alpha=50.0)),
                  'RandomForest': RandomForestRegressor(n_estimators=15, max_depth=4, min_samples_leaf=50, random_state=7, n_jobs=1),
              }
              records = []
              preds_out = []
              for name, model in models.items():
                  model.fit(train[feature_cols], train['target_fwd_return'])
                  pred = model.predict(test[feature_cols])
                  ic = spearmanr(test['target_fwd_return'], pred).correlation
                  records.append({'model': name, 'spearman_ic': float(ic), 'mae': float(mean_absolute_error(test['target_fwd_return'], pred)), 'r2': float(r2_score(test['target_fwd_return'], pred))})
                  tmp = test[['date','asset','target_fwd_return']].copy()
                  tmp['prediction'] = pred
                  tmp['model'] = name
                  preds_out.append(tmp)
              return pd.DataFrame(records).sort_values('spearman_ic', ascending=False), pd.concat(preds_out), feature_cols
          
          
          def backtest(preds: pd.DataFrame, model_name: str) -> pd.Series:
              p = preds[preds['model'] == model_name].copy()
              p['rank'] = p.groupby('date')['prediction'].rank(method='first')
              p['n'] = p.groupby('date')['prediction'].transform('count')
              p['weight'] = 0.0
              p.loc[p['rank'] <= 2, 'weight'] = -0.25
              p.loc[p['rank'] > p['n'] - 2, 'weight'] = 0.25
              daily = p.groupby('date').apply(lambda x: float((x['weight'] * x['target_fwd_return']).sum()), include_groups=False)
              daily = daily / 20.0
              cost = 0.0005 * 0.5
              daily = daily - cost
              return (1 + daily).cumprod()
          
          
          def plot_outputs(prices, features, decay, leaderboard, preds, feature_cols):
              plt.figure(figsize=(10, 4))
              features['critical_materials_stress_index'].dropna().plot()
              plt.title('Critical Materials Stress Index')
              plt.tight_layout(); plt.savefig(FIG/'cmsi.png', dpi=160); plt.close()
          
              heat = decay.pivot(index='feature', columns='horizon', values='mean_ic')
              plt.figure(figsize=(8, max(4, 0.35 * len(heat))))
              plt.imshow(heat.fillna(0), aspect='auto')
              plt.xticks(range(len(heat.columns)), heat.columns)
              plt.yticks(range(len(heat.index)), heat.index, fontsize=7)
              plt.colorbar(label='Mean Spearman IC')
              plt.title('Signal Decay: Feature × Horizon')
              plt.tight_layout(); plt.savefig(FIG/'signal_decay_heatmap.png', dpi=160); plt.close()
          
              plt.figure(figsize=(7, 4))
              plt.bar(leaderboard['model'], leaderboard['spearman_ic'])
              plt.title('ML Model Leaderboard')
              plt.ylabel('Spearman IC')
              plt.tight_layout(); plt.savefig(FIG/'model_leaderboard.png', dpi=160); plt.close()
          
              best = leaderboard.iloc[0]['model']
              eq = backtest(preds, best)
              plt.figure(figsize=(9, 4))
              eq.plot()
              plt.title(f'Prototype Long/Short Equity Curve — {best}')
              plt.ylabel('Growth of $1')
              plt.tight_layout(); plt.savefig(FIG/'backtest_equity_curve.png', dpi=160); plt.close()
          
              # simple correlation importance
              best_preds = preds[preds['model'] == best]
              # use decay values as honest available importance proxy
              imp = decay.dropna().copy().groupby('feature')['mean_ic'].mean().abs().sort_values(ascending=False).head(12)
              plt.figure(figsize=(8, 4))
              imp.iloc[::-1].plot(kind='barh')
              plt.title('Prototype Feature Importance Proxy')
              plt.tight_layout(); plt.savefig(FIG/'feature_importance.png', dpi=160); plt.close()
              return eq
          
          
          def write_report(prices, features, decay, leaderboard, eq):
              best = leaderboard.iloc[0]
              sharpe = np.sqrt(252) * eq.pct_change().mean() / (eq.pct_change().std() + 1e-12)
              report = f'''# MatQuantLab Research Summary
          
          ## Research Question
          Can critical-materials, commodity, and macro stress signals predict future returns in mining, materials, aerospace, defense, industrial, and additive-manufacturing-linked assets?
          
          ## Data Status
          - Price matrix shape: `{prices.shape}`
          - Feature matrix shape: `{features.shape}`
          - First date: `{prices.index.min().date()}`
          - Last date: `{prices.index.max().date()}`
          
          ## ML Result
          Best prototype model: **{best['model']}**
          
          - Spearman IC: `{best['spearman_ic']:.4f}`
          - MAE: `{best['mae']:.4f}`
          - R²: `{best['r2']:.4f}`
          
          ## Prototype Backtest
          - Final growth of $1: `{eq.iloc[-1]:.3f}`
          - Approx. Sharpe: `{sharpe:.2f}`
          
          ## Generated Figures
          ![Critical Materials Stress Index](figures/cmsi.png)
          
          ![Signal Decay Heatmap](figures/signal_decay_heatmap.png)
          
          ![Model Leaderboard](figures/model_leaderboard.png)
          
          ![Backtest Equity Curve](figures/backtest_equity_curve.png)
          
          ![Feature Importance](figures/feature_importance.png)
          
          ## Warning
          This is a research prototype, not financial advice and not a production trading system. Free market data can contain missing values, survivorship bias, and vendor errors.
          '''
              (OUT/'research_summary.md').write_text(report, encoding='utf-8')
          
          
          def main():
              prices = fetch_prices()
              prices.to_csv(DATA/'prices.csv')
              features = make_features(prices)
              features.to_csv(DATA/'features.csv')
              panel = make_panel(prices, features, horizon=20)
              panel.to_csv(DATA/'panel_20d.csv', index=False)
              decay = signal_decay(panel, prices, features)
              decay.to_csv(OUT/'signal_decay.csv', index=False)
              leaderboard, preds, feature_cols = train_models(panel)
              leaderboard.to_csv(OUT/'model_leaderboard.csv', index=False)
              preds.to_csv(OUT/'predictions.csv', index=False)
              eq = plot_outputs(prices, features, decay, leaderboard, preds, feature_cols)
              write_report(prices, features, decay, leaderboard, eq)
              print('MatQuantLab CI pipeline completed.')
              print(leaderboard)
          
          if __name__ == '__main__':
              main()
          PY

      - name: Run ML research pipeline
        run: |
          python scripts/github_research_pipeline.py

      - name: Commit generated research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.txt pyproject.toml scripts/github_research_pipeline.py outputs data/processed || true
          git commit -m "Run MatQuantLab ML research pipeline" || echo "No generated changes to commit"
          git push || true
