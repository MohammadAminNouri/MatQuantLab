name: Run MatQuantLab Research Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies directly
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scikit-learn yfinance

      - name: Create self-contained MatQuantLab pipeline
        run: |
          mkdir -p scripts data/processed outputs/figures outputs/reports
          cat > scripts/github_research_pipeline.py <<'PY'
          from pathlib import Path
          import warnings
          warnings.filterwarnings("ignore")

          import numpy as np
          import pandas as pd
          import matplotlib.pyplot as plt
          from sklearn.ensemble import RandomForestRegressor
          from sklearn.linear_model import Ridge
          from sklearn.metrics import mean_squared_error

          OUT = Path("outputs")
          FIG = OUT / "figures"
          REP = OUT / "reports"
          DATA = Path("data/processed")
          for p in [FIG, REP, DATA]:
              p.mkdir(parents=True, exist_ok=True)

          np.random.seed(42)

          ASSETS = ["SPY", "XLB", "XME", "COPX", "PICK", "XLI", "ITA", "XAR", "PRNT"]
          FACTORS = ["HG=F", "CL=F", "NG=F", "GC=F", "^VIX", "^TNX", "DX-Y.NYB"]
          ALL_TICKERS = ASSETS + FACTORS
          SOURCE_NOTE = "Yahoo Finance via yfinance"

          def download_prices():
              try:
                  import yfinance as yf
                  raw = yf.download(
                      ALL_TICKERS,
                      start="2014-01-01",
                      auto_adjust=True,
                      progress=False,
                      threads=True,
                  )
                  if isinstance(raw.columns, pd.MultiIndex):
                      if "Close" in raw.columns.get_level_values(0):
                          px = raw["Close"].copy()
                      else:
                          px = raw.xs("Close", axis=1, level=1).copy()
                  else:
                      px = raw.copy()
                  px = px.dropna(how="all").ffill().dropna(axis=1, thresh=500)
                  keep = [c for c in ALL_TICKERS if c in px.columns]
                  px = px[keep]
                  if px.shape[0] < 700 or len(set(ASSETS).intersection(px.columns)) < 5:
                      raise ValueError("Not enough reliable downloaded data")
                  return px, SOURCE_NOTE
              except Exception as exc:
                  print("Live download failed, using deterministic fallback data:", exc)
                  dates = pd.bdate_range("2014-01-01", periods=2600)
                  cols = ALL_TICKERS
                  common = np.random.normal(0, 0.008, (len(dates), 1))
                  metal = np.random.normal(0, 0.010, (len(dates), 1))
                  noise = np.random.normal(0, 0.012, (len(dates), len(cols)))
                  rets = 0.35 * common + 0.20 * metal + noise
                  prices = 100 * np.exp(pd.DataFrame(rets, index=dates, columns=cols).cumsum())
                  return prices, "deterministic fallback data because live download failed"

          def zscore(s, window=60):
              mu = s.rolling(window).mean()
              sig = s.rolling(window).std()
              return (s - mu) / sig

          prices, source_note = download_prices()
          prices.to_csv(DATA / "prices.csv")
          returns = prices.pct_change().replace([np.inf, -np.inf], np.nan)

          available_assets = [a for a in ASSETS if a in prices.columns]
          available_factors = [f for f in FACTORS if f in prices.columns]

          features = pd.DataFrame(index=prices.index)
          for f in available_factors:
              r20 = prices[f].pct_change(20)
              features[f"shock20_{f.replace('=','').replace('^','')}"] = zscore(r20, 120)
              features[f"mom60_{f.replace('=','').replace('^','')}"] = prices[f].pct_change(60)

          stress_cols = [c for c in features.columns if c.startswith("shock20_")]
          if stress_cols:
              signed = features[stress_cols].copy()
              features["critical_materials_stress_index"] = signed.mean(axis=1)
          else:
              features["critical_materials_stress_index"] = 0.0

          # Asset-specific technical features.
          for a in available_assets:
              features[f"mom20_{a}"] = prices[a].pct_change(20)
              features[f"vol20_{a}"] = returns[a].rolling(20).std() * np.sqrt(252)

          features = features.replace([np.inf, -np.inf], np.nan).dropna()
          features.to_csv(DATA / "features.csv")

          horizon = 20
          future = prices[available_assets].pct_change(horizon).shift(-horizon)
          next_day = returns[available_assets].shift(-1)

          # Lead-lag IC heatmap.
          base_feature_cols = [c for c in features.columns if not c.startswith("mom20_") and not c.startswith("vol20_")]
          ic = pd.DataFrame(index=base_feature_cols, columns=available_assets, dtype=float)
          for feat in base_feature_cols:
              for asset in available_assets:
                  aligned = pd.concat([features[feat], future[asset]], axis=1).dropna()
                  if len(aligned) > 100:
                      ic.loc[feat, asset] = aligned.iloc[:, 0].corr(aligned.iloc[:, 1], method="spearman")
          ic.to_csv(DATA / "lead_lag_ic.csv")

          fig, ax = plt.subplots(figsize=(11, max(4, 0.35 * len(ic))))
          arr = ic.fillna(0).values.astype(float)
          im = ax.imshow(arr, aspect="auto")
          ax.set_xticks(range(len(ic.columns)))
          ax.set_xticklabels(ic.columns, rotation=45, ha="right")
          ax.set_yticks(range(len(ic.index)))
          ax.set_yticklabels(ic.index, fontsize=8)
          ax.set_title("Lead-Lag Spearman IC: Features vs 20D Future Returns")
          fig.colorbar(im, ax=ax, label="Spearman IC")
          fig.tight_layout()
          fig.savefig(FIG / "lead_lag_ic_heatmap.png", dpi=180)
          plt.close(fig)

          # CMSI plot.
          fig, ax = plt.subplots(figsize=(11, 4))
          features["critical_materials_stress_index"].dropna().plot(ax=ax)
          ax.axhline(0, linewidth=1)
          ax.set_title("Critical Materials Stress Index")
          ax.set_ylabel("z-score composite")
          fig.tight_layout()
          fig.savefig(FIG / "critical_materials_stress_index.png", dpi=180)
          plt.close(fig)

          # ML dataset.
          rows = []
          for asset in available_assets:
              asset_features = features[base_feature_cols + [f"mom20_{asset}", f"vol20_{asset}"]].copy()
              target = future[asset].rename("target")
              nd = next_day[asset].rename("next_day_return")
              df = pd.concat([asset_features, target, nd], axis=1).dropna()
              df["asset"] = asset
              rows.append(df)
          panel = pd.concat(rows).sort_index()
          panel.to_csv(DATA / "ml_panel.csv")

          feature_cols = [c for c in panel.columns if c not in ["target", "next_day_return", "asset"]]
          dates = sorted(panel.index.unique())
          split_date = dates[int(len(dates) * 0.70)]
          train = panel[panel.index <= split_date]
          test = panel[panel.index > split_date]

          X_train = train[feature_cols].fillna(0)
          y_train = train["target"]
          X_test = test[feature_cols].fillna(0)
          y_test = test["target"]

          models = {
              "Ridge": Ridge(alpha=10.0),
              "RandomForest": RandomForestRegressor(
                  n_estimators=250,
                  max_depth=5,
                  min_samples_leaf=20,
                  random_state=42,
                  n_jobs=-1,
              ),
          }
          leaderboard = []
          predictions = test[["asset", "next_day_return", "target"]].copy()
          for name, model in models.items():
              model.fit(X_train, y_train)
              pred = pd.Series(model.predict(X_test), index=X_test.index, name=name)
              predictions[name] = pred
              ic_model = pred.corr(y_test, method="spearman")
              rmse = mean_squared_error(y_test, pred, squared=False)
              leaderboard.append({"model": name, "spearman_ic": ic_model, "rmse": rmse})

          leaderboard = pd.DataFrame(leaderboard).sort_values("spearman_ic", ascending=False)
          leaderboard.to_csv(DATA / "model_leaderboard.csv", index=False)
          predictions.to_csv(DATA / "predictions.csv")

          fig, ax = plt.subplots(figsize=(7, 4))
          ax.bar(leaderboard["model"], leaderboard["spearman_ic"])
          ax.axhline(0, linewidth=1)
          ax.set_title("ML Model Leaderboard: Out-of-Sample Spearman IC")
          ax.set_ylabel("Spearman IC")
          fig.tight_layout()
          fig.savefig(FIG / "model_leaderboard.png", dpi=180)
          plt.close(fig)

          # Feature importance.
          rf = models["RandomForest"]
          imp = pd.Series(rf.feature_importances_, index=feature_cols).sort_values(ascending=False).head(12)
          fig, ax = plt.subplots(figsize=(9, 5))
          ax.barh(imp.index[::-1], imp.values[::-1])
          ax.set_title("Random Forest Feature Importance")
          fig.tight_layout()
          fig.savefig(FIG / "feature_importance.png", dpi=180)
          plt.close(fig)

          # Simple long-short strategy from best model predictions.
          best_model = leaderboard.iloc[0]["model"]
          pred_table = predictions.reset_index().pivot_table(index="index", columns="asset", values=best_model)
          ret_table = predictions.reset_index().pivot_table(index="index", columns="asset", values="next_day_return")
          gross = []
          turnover = []
          prev_w = pd.Series(0.0, index=available_assets)
          for dt in pred_table.index:
              scores = pred_table.loc[dt].dropna()
              if len(scores) < 4:
                  continue
              longs = scores.nlargest(min(3, len(scores)//2)).index
              shorts = scores.nsmallest(min(3, len(scores)//2)).index
              w = pd.Series(0.0, index=available_assets)
              w.loc[longs] = 0.5 / len(longs)
              w.loc[shorts] = -0.5 / len(shorts)
              r = ret_table.loc[dt].reindex(available_assets).fillna(0.0)
              gross_ret = float((w * r).sum())
              turn = float((w - prev_w).abs().sum())
              cost = turn * 0.0005
              gross.append((dt, gross_ret, gross_ret - cost, turn))
              prev_w = w
          bt = pd.DataFrame(gross, columns=["date", "gross_return", "net_return", "turnover"]).set_index("date")
          bt["gross_equity"] = (1 + bt["gross_return"]).cumprod()
          bt["net_equity"] = (1 + bt["net_return"]).cumprod()
          bt.to_csv(DATA / "backtest.csv")

          fig, ax = plt.subplots(figsize=(11, 4))
          bt[["gross_equity", "net_equity"]].plot(ax=ax)
          ax.set_title("Long-Short Strategy Equity Curve: Gross vs Net")
          ax.set_ylabel("Growth of $1")
          fig.tight_layout()
          fig.savefig(FIG / "backtest_equity_curve.png", dpi=180)
          plt.close(fig)

          def sharpe(x):
              x = pd.Series(x).dropna()
              if x.std() == 0 or len(x) < 5:
                  return np.nan
              return float(np.sqrt(252) * x.mean() / x.std())

          net_sharpe = sharpe(bt["net_return"])
          gross_sharpe = sharpe(bt["gross_return"])
          max_dd = float((bt["net_equity"] / bt["net_equity"].cummax() - 1).min())

          summary = f"""# MatQuantLab Research Summary

          ## Status

          The GitHub Actions pipeline ran successfully and generated data, machine-learning outputs, and figures.

          ## Data source

          {source_note}

          ## Research question

          Do industrial-metal, energy, volatility, rates, and USD shocks contain useful lead-lag information for materials, mining, aerospace, defense, industrial, and additive-manufacturing-linked assets?

          ## Main generated files

          - `outputs/figures/critical_materials_stress_index.png`
          - `outputs/figures/lead_lag_ic_heatmap.png`
          - `outputs/figures/model_leaderboard.png`
          - `outputs/figures/feature_importance.png`
          - `outputs/figures/backtest_equity_curve.png`
          - `data/processed/lead_lag_ic.csv`
          - `data/processed/model_leaderboard.csv`
          - `data/processed/backtest.csv`

          ## Model leaderboard

          {leaderboard.to_markdown(index=False)}

          ## Backtest diagnostics

          - Gross Sharpe: {gross_sharpe:.3f}
          - Net Sharpe after simple turnover cost: {net_sharpe:.3f}
          - Max drawdown: {max_dd:.2%}
          - Average daily turnover: {bt['turnover'].mean():.3f}

          ## Interpretation warning

          This is research code, not financial advice and not a production trading system. Free market data can contain errors and survivorship bias. The next research step is stronger walk-forward validation and deeper robustness tests.
          """
          (OUT / "research_summary.md").write_text(summary, encoding="utf-8")
          (REP / "research_summary.md").write_text(summary, encoding="utf-8")
          print("MatQuantLab pipeline finished successfully.")
          print(leaderboard)
          print("Figures written to", FIG)
          PY

      - name: Run MatQuantLab pipeline
        run: |
          python scripts/github_research_pipeline.py

      - name: Commit generated outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/github_research_pipeline.py data outputs
          git commit -m "Generate MatQuantLab research outputs" || echo "No generated changes to commit"
          git push
