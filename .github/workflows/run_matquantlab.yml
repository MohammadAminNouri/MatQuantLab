{"name":"Run MatQuantLab Research Pipeline","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"run-pipeline":{"runs-on":"ubuntu-latest","steps":[{"name":"Checkout repository","uses":"actions/checkout@v4"},{"name":"Set up Python","uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"Install dependencies","run":"python -m pip install --upgrade pip\npip install numpy pandas scipy scikit-learn matplotlib yfinance"},{"name":"Run standalone ML research pipeline","run":"mkdir -p scripts outputs/figures data/processed\ncat > scripts/github_research_pipeline.py <<'PY'\nfrom pathlib import Path\nimport warnings\nwarnings.filterwarnings(\"ignore\")\n\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom scipy.stats import spearmanr\nfrom sklearn.ensemble import RandomForestRegressor\nfrom sklearn.linear_model import Ridge, ElasticNet\nfrom sklearn.metrics import mean_absolute_error, r2_score\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\nROOT = Path.cwd()\nDATA = ROOT / \"data\" / \"processed\"\nOUT = ROOT / \"outputs\"\nFIG = OUT / \"figures\"\nfor p in [DATA, OUT, FIG]:\n    p.mkdir(parents=True, exist_ok=True)\n\nASSETS = [\"SPY\",\"XLB\",\"XME\",\"COPX\",\"PICK\",\"ITA\",\"XAR\",\"XLI\",\"VIS\",\"PRNT\",\"DDD\",\"SSYS\",\"MTLS\",\"NNDM\"]\nCOMMODITIES = [\"HG=F\",\"CL=F\",\"NG=F\",\"GC=F\",\"SI=F\",\"^VIX\",\"^TNX\",\"DX-Y.NYB\"]\nALL = ASSETS + COMMODITIES\n\ndef synthetic_prices():\n    dates = pd.bdate_range(\"2016-01-01\", periods=2100)\n    rng = np.random.default_rng(42)\n    cu = rng.normal(0, 0.012, len(dates))\n    oil = rng.normal(0, 0.014, len(dates))\n    vix = rng.normal(0, 0.020, len(dates))\n    data = {}\n    for t in COMMODITIES:\n        r = rng.normal(0, 0.010, len(dates))\n        if t == \"HG=F\": r = cu\n        if t == \"CL=F\": r = oil\n        if t == \"^VIX\": r = vix\n        data[t] = 100 * np.exp(np.cumsum(r))\n    for i, t in enumerate(ASSETS):\n        beta_cu = 0.12 if t in [\"XME\",\"COPX\",\"PICK\",\"XLB\"] else 0.035\n        beta_oil = -0.06 if t in [\"ITA\",\"XAR\",\"PRNT\"] else 0.02\n        beta_vix = -0.12 if t != \"SPY\" else -0.08\n        eps = rng.normal(0, 0.012 + 0.001*(i % 4), len(dates))\n        r = 0.00015 + beta_cu*np.roll(cu, 5) + beta_oil*np.roll(oil, 5) + beta_vix*np.roll(vix, 2) + eps\n        data[t] = 100 * np.exp(np.cumsum(r))\n    return pd.DataFrame(data, index=dates)\n\ndef fetch_prices():\n    try:\n        import yfinance as yf\n        px = yf.download(ALL, start=\"2016-01-01\", auto_adjust=True, progress=False, threads=False)\n        if isinstance(px.columns, pd.MultiIndex):\n            px = px[\"Close\"]\n        else:\n            px = px[[\"Close\"]].rename(columns={\"Close\": ALL[0]})\n        px = px.dropna(axis=1, thresh=500).ffill()\n        usable_assets = [c for c in ASSETS if c in px.columns]\n        usable_comms = [c for c in COMMODITIES if c in px.columns]\n        if len(usable_assets) >= 5 and len(usable_comms) >= 3:\n            print(\"Using live Yahoo Finance data.\")\n            return px\n    except Exception as e:\n        print(\"Live download failed, using demo data:\", e)\n    print(\"Using deterministic demo data.\")\n    return synthetic_prices()\n\ndef zscore(s, window=126):\n    return (s - s.rolling(window).mean()) / s.rolling(window).std()\n\ndef make_features(prices):\n    parts = []\n    for t in [c for c in COMMODITIES if c in prices.columns]:\n        for w in [5, 20, 60]:\n            parts.append(zscore(prices[t].pct_change(w), 126).rename(f\"shock_z_{w}d__{t}\"))\n    features = pd.concat(parts, axis=1)\n    shock20 = [c for c in features.columns if c.startswith(\"shock_z_20d\")]\n    features[\"critical_materials_stress_index\"] = zscore(features[shock20].abs().mean(axis=1), 126)\n    return features.replace([np.inf, -np.inf], np.nan)\n\ndef make_panel(prices, features, horizon=20):\n    frames = []\n    for asset in [a for a in ASSETS if a in prices.columns]:\n        d = features.copy()\n        d[\"date\"] = d.index\n        d[\"asset\"] = asset\n        d[\"asset_mom_20\"] = prices[asset].pct_change(20)\n        d[\"asset_mom_60\"] = prices[asset].pct_change(60)\n        d[\"asset_vol_20\"] = prices[asset].pct_change().rolling(20).std()\n        d[\"target_fwd_return\"] = prices[asset].pct_change(horizon).shift(-horizon)\n        frames.append(d)\n    panel = pd.concat(frames, ignore_index=True)\n    return panel.dropna(subset=[\"target_fwd_return\"])\n\ndef signal_decay(prices, features):\n    feats = [c for c in features.columns if \"shock_z_20d\" in c][:8] + [\"critical_materials_stress_index\"]\n    rows = []\n    for f in feats:\n        for h in [5,20,60]:\n            vals = []\n            for a in [x for x in ASSETS if x in prices.columns]:\n                tmp = pd.DataFrame({\"x\": features[f], \"y\": prices[a].pct_change(h).shift(-h)}).dropna()\n                if len(tmp) > 150:\n                    ic = spearmanr(tmp[\"x\"], tmp[\"y\"]).correlation\n                    if np.isfinite(ic):\n                        vals.append(ic)\n            rows.append({\"feature\": f, \"horizon\": f\"{h}D\", \"mean_ic\": float(np.mean(vals)) if vals else np.nan})\n    return pd.DataFrame(rows)\n\ndef train_models(panel):\n    ignore = {\"date\",\"asset\",\"target_fwd_return\"}\n    feature_cols = [c for c in panel.columns if c not in ignore and pd.api.types.is_numeric_dtype(panel[c])]\n    clean = panel[[\"date\",\"asset\",\"target_fwd_return\"] + feature_cols].replace([np.inf,-np.inf], np.nan).dropna()\n    dates = np.sort(clean[\"date\"].unique())\n    split = dates[int(len(dates)*0.70)]\n    train = clean[clean[\"date\"] < split]\n    test = clean[clean[\"date\"] >= split]\n    models = {\n        \"Ridge\": make_pipeline(StandardScaler(), Ridge(alpha=10.0)),\n        \"ElasticNet\": make_pipeline(StandardScaler(), ElasticNet(alpha=0.001, l1_ratio=0.25, max_iter=5000)),\n        \"RandomForest\": RandomForestRegressor(n_estimators=40, max_depth=5, min_samples_leaf=40, random_state=7, n_jobs=1),\n    }\n    rows, pred_frames = [], []\n    for name, model in models.items():\n        model.fit(train[feature_cols], train[\"target_fwd_return\"])\n        pred = model.predict(test[feature_cols])\n        ic = spearmanr(test[\"target_fwd_return\"], pred).correlation\n        rows.append({\"model\": name, \"spearman_ic\": float(ic), \"mae\": float(mean_absolute_error(test[\"target_fwd_return\"], pred)), \"r2\": float(r2_score(test[\"target_fwd_return\"], pred))})\n        tmp = test[[\"date\",\"asset\",\"target_fwd_return\"]].copy()\n        tmp[\"prediction\"] = pred\n        tmp[\"model\"] = name\n        pred_frames.append(tmp)\n    return pd.DataFrame(rows).sort_values(\"spearman_ic\", ascending=False), pd.concat(pred_frames), feature_cols\n\ndef backtest(preds, model):\n    p = preds[preds[\"model\"] == model].copy()\n    p[\"rank\"] = p.groupby(\"date\")[\"prediction\"].rank(method=\"first\")\n    p[\"n\"] = p.groupby(\"date\")[\"prediction\"].transform(\"count\")\n    p[\"weight\"] = 0.0\n    p.loc[p[\"rank\"] <= 2, \"weight\"] = -0.25\n    p.loc[p[\"rank\"] > p[\"n\"] - 2, \"weight\"] = 0.25\n    daily = p.assign(contrib=p[\"weight\"] * p[\"target_fwd_return\"]).groupby(\"date\")[\"contrib\"].sum()\n    daily = daily / 20.0 - 0.00025\n    return (1 + daily).cumprod()\n\ndef plot_all(prices, features, decay, leaderboard, preds):\n    plt.figure(figsize=(10,4))\n    features[\"critical_materials_stress_index\"].dropna().plot()\n    plt.title(\"Critical Materials Stress Index\")\n    plt.tight_layout(); plt.savefig(FIG/\"cmsi.png\", dpi=160); plt.close()\n\n    heat = decay.pivot(index=\"feature\", columns=\"horizon\", values=\"mean_ic\")\n    plt.figure(figsize=(8, max(4, 0.35*len(heat))))\n    plt.imshow(heat.fillna(0), aspect=\"auto\")\n    plt.xticks(range(len(heat.columns)), heat.columns)\n    plt.yticks(range(len(heat.index)), heat.index, fontsize=7)\n    plt.colorbar(label=\"Mean Spearman IC\")\n    plt.title(\"Signal Decay: Feature \u00d7 Horizon\")\n    plt.tight_layout(); plt.savefig(FIG/\"signal_decay_heatmap.png\", dpi=160); plt.close()\n\n    plt.figure(figsize=(7,4))\n    plt.bar(leaderboard[\"model\"], leaderboard[\"spearman_ic\"])\n    plt.ylabel(\"Spearman IC\")\n    plt.title(\"ML Model Leaderboard\")\n    plt.tight_layout(); plt.savefig(FIG/\"model_leaderboard.png\", dpi=160); plt.close()\n\n    best = leaderboard.iloc[0][\"model\"]\n    eq = backtest(preds, best)\n    plt.figure(figsize=(9,4))\n    eq.plot()\n    plt.title(f\"Prototype Long/Short Equity Curve \u2014 {best}\")\n    plt.ylabel(\"Growth of $1\")\n    plt.tight_layout(); plt.savefig(FIG/\"backtest_equity_curve.png\", dpi=160); plt.close()\n\n    imp = decay.dropna().groupby(\"feature\")[\"mean_ic\"].mean().abs().sort_values(ascending=False).head(12)\n    plt.figure(figsize=(8,4))\n    imp.iloc[::-1].plot(kind=\"barh\")\n    plt.title(\"Feature Importance Proxy\")\n    plt.tight_layout(); plt.savefig(FIG/\"feature_importance.png\", dpi=160); plt.close()\n    return eq\n\ndef write_report(prices, features, leaderboard, eq):\n    r = eq.pct_change().dropna()\n    sharpe = np.sqrt(252) * r.mean() / (r.std() + 1e-12)\n    best = leaderboard.iloc[0]\n    md = f\"\"\"# MatQuantLab Research Summary\n\n## Core question\nCan critical-materials, commodity, and macro-stress signals predict future returns in mining, materials, aerospace, defense, industrial, and additive-manufacturing-linked assets?\n\n## Pipeline result\n- Price matrix: `{prices.shape}`\n- Feature matrix: `{features.shape}`\n- Start date: `{prices.index.min().date()}`\n- End date: `{prices.index.max().date()}`\n\n## Best ML model\n- Model: **{best['model']}**\n- Spearman IC: `{best['spearman_ic']:.4f}`\n- MAE: `{best['mae']:.4f}`\n- R\u00b2: `{best['r2']:.4f}`\n\n## Prototype backtest\n- Final growth of $1: `{eq.iloc[-1]:.3f}`\n- Approx. Sharpe: `{sharpe:.2f}`\n\n## Figures\n![Critical Materials Stress Index](figures/cmsi.png)\n\n![Signal Decay Heatmap](figures/signal_decay_heatmap.png)\n\n![Model Leaderboard](figures/model_leaderboard.png)\n\n![Backtest Equity Curve](figures/backtest_equity_curve.png)\n\n![Feature Importance](figures/feature_importance.png)\n\n## Warning\nThis is a research prototype, not financial advice and not a production trading system.\n\"\"\"\n    (OUT/\"research_summary.md\").write_text(md, encoding=\"utf-8\")\n\ndef main():\n    prices = fetch_prices()\n    prices.to_csv(DATA/\"prices.csv\")\n    features = make_features(prices)\n    features.to_csv(DATA/\"features.csv\")\n    panel = make_panel(prices, features, 20)\n    panel.to_csv(DATA/\"panel_20d.csv\", index=False)\n    decay = signal_decay(prices, features)\n    decay.to_csv(OUT/\"signal_decay.csv\", index=False)\n    leaderboard, preds, feature_cols = train_models(panel)\n    leaderboard.to_csv(OUT/\"model_leaderboard.csv\", index=False)\n    preds.to_csv(OUT/\"predictions.csv\", index=False)\n    eq = plot_all(prices, features, decay, leaderboard, preds)\n    write_report(prices, features, leaderboard, eq)\n    print(\"MatQuantLab workflow completed.\")\n    print(leaderboard)\n\nif __name__ == \"__main__\":\n    main()\nPY\npython scripts/github_research_pipeline.py"},{"name":"Commit generated outputs","run":"git config user.name \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\ngit add scripts/github_research_pipeline.py outputs data/processed || true\ngit commit -m \"Generate MatQuantLab ML outputs\" || echo \"No generated changes to commit\"\ngit push || true"}]}}}
