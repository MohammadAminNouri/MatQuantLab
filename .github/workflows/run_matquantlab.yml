{"name":"Run MatQuantLab Research Pipeline","on":{"workflow_dispatch":{},"push":{"branches":["main"]}},"permissions":{"contents":"write"},"jobs":{"run-pipeline":{"runs-on":"ubuntu-latest","steps":[{"name":"Checkout repository","uses":"actions/checkout@v4"},{"name":"Set up Python","uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"Install dependencies","run":"python -m pip install --upgrade pip\npip install numpy pandas matplotlib scikit-learn yfinance"},{"name":"Create and run robust self-contained MatQuantLab pipeline","run":"cat > github_pipeline.py <<'PY'\nfrom pathlib import Path\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.linear_model import Ridge\nfrom sklearn.ensemble import RandomForestRegressor\nfrom sklearn.metrics import mean_squared_error\nimport yfinance as yf\n\nPath(\"outputs/figures\").mkdir(parents=True, exist_ok=True)\nPath(\"data/processed\").mkdir(parents=True, exist_ok=True)\n\ntickers = [\"SPY\",\"XLB\",\"XME\",\"COPX\",\"PICK\",\"ITA\",\"XAR\",\"XLI\",\"VIS\",\"PRNT\"]\ncommodities = {\"Copper\":\"HG=F\",\"Aluminum\":\"ALI=F\",\"Oil\":\"CL=F\",\"Gold\":\"GC=F\",\"USD\":\"DX-Y.NYB\",\"VIX\":\"^VIX\"}\nall_tickers = tickers + list(commodities.values())\n\nraw = yf.download(all_tickers, period=\"8y\", auto_adjust=True, progress=False, threads=False)\nif isinstance(raw.columns, pd.MultiIndex):\n    prices = raw[\"Close\"].copy()\nelse:\n    prices = raw[[\"Close\"]].copy()\nprices = prices.dropna(axis=1, how=\"all\").ffill().dropna(how=\"all\")\nprices.to_csv(\"data/processed/prices.csv\")\n\nfeatures = pd.DataFrame(index=prices.index)\nfor name, t in commodities.items():\n    if t in prices.columns:\n        r20 = prices[t].pct_change(20)\n        z = (r20 - r20.rolling(126, min_periods=40).mean()) / r20.rolling(126, min_periods=40).std()\n        features[f\"{name}_shock_20d\"] = z\n\nfeature_cols = list(features.columns)\nif not feature_cols:\n    raise RuntimeError(\"No commodity features were created. Yahoo download returned insufficient data.\")\n\nfeatures[\"CMSI\"] = features[feature_cols].mean(axis=1)\nfeatures = features.replace([np.inf, -np.inf], np.nan).dropna()\nfeatures.to_csv(\"data/processed/features.csv\")\n\nplt.figure(figsize=(10,4))\nfeatures[\"CMSI\"].plot(title=\"Critical Materials Stress Index\")\nplt.tight_layout()\nplt.savefig(\"outputs/figures/cmsi.png\", dpi=160)\nplt.close()\n\ntarget_assets = [t for t in tickers if t in prices.columns]\nrows = []\nfor asset in target_assets:\n    fwd = prices[asset].pct_change(20).shift(-20).rename(\"future_return_20d\")\n    for feat in features.columns:\n        aligned = pd.concat([features[feat], fwd], axis=1, join=\"inner\").dropna()\n        if len(aligned) > 80:\n            ic = aligned.iloc[:,0].corr(aligned.iloc[:,1], method=\"spearman\")\n            rows.append({\"asset\":asset,\"feature\":feat,\"horizon\":\"20d\",\"spearman_ic\":float(ic)})\nic_df = pd.DataFrame(rows)\nif ic_df.empty:\n    raise RuntimeError(\"Signal analysis produced no rows. Not enough aligned asset/feature data.\")\nic_df = ic_df.sort_values(\"spearman_ic\", ascending=False)\nic_df.to_csv(\"data/processed/signal_decay_20d.csv\", index=False)\n\npivot = ic_df.pivot_table(index=\"asset\", columns=\"feature\", values=\"spearman_ic\")\nplt.figure(figsize=(10,5))\nplt.imshow(pivot.fillna(0), aspect=\"auto\")\nplt.xticks(range(len(pivot.columns)), pivot.columns, rotation=45, ha=\"right\")\nplt.yticks(range(len(pivot.index)), pivot.index)\nplt.colorbar(label=\"Spearman IC\")\nplt.title(\"20D Lead-Lag Signal Heatmap\")\nplt.tight_layout()\nplt.savefig(\"outputs/figures/signal_decay_heatmap.png\", dpi=160)\nplt.close()\n\npanel_parts = []\nfor asset in target_assets:\n    y = prices[asset].pct_change(20).shift(-20).rename(\"target_20d\")\n    df = pd.concat([features, y], axis=1, join=\"inner\").dropna()\n    if len(df) > 100:\n        df[\"asset\"] = asset\n        panel_parts.append(df)\nif not panel_parts:\n    raise RuntimeError(\"No asset had enough aligned rows for ML panel.\")\npanel = pd.concat(panel_parts).reset_index(names=\"date\")\npanel.to_csv(\"data/processed/panel_20d.csv\", index=False)\n\nX = panel[features.columns].replace([np.inf, -np.inf], np.nan).fillna(0)\ny = panel[\"target_20d\"].astype(float)\nsplit = max(50, int(len(panel) * 0.75))\nif split >= len(panel) - 10:\n    split = int(len(panel) * 0.70)\nX_train, X_test = X.iloc[:split], X.iloc[split:]\ny_train, y_test = y.iloc[:split], y.iloc[split:]\n\nmodels = {\n    \"Ridge\": Ridge(alpha=10.0),\n    \"RandomForest\": RandomForestRegressor(n_estimators=120, max_depth=4, random_state=42)\n}\nleader = []\npreds = {}\nfor name, model in models.items():\n    model.fit(X_train, y_train)\n    pred = model.predict(X_test)\n    preds[name] = pred\n    rmse = float(mean_squared_error(y_test, pred) ** 0.5)\n    corr = float(pd.Series(pred).corr(pd.Series(y_test.values)))\n    if np.isnan(corr):\n        corr = 0.0\n    leader.append({\"model\":name, \"rmse\":rmse, \"corr\":corr})\nleader = pd.DataFrame(leader).sort_values(\"rmse\")\nleader.to_csv(\"data/processed/model_leaderboard.csv\", index=False)\n\nplt.figure(figsize=(6,4))\nplt.bar(leader[\"model\"], leader[\"corr\"])\nplt.title(\"Model Test Correlation\")\nplt.tight_layout()\nplt.savefig(\"outputs/figures/model_leaderboard.png\", dpi=160)\nplt.close()\n\nbest = leader.iloc[0][\"model\"]\npanel_test = panel.iloc[split:].copy()\npanel_test[\"pred\"] = preds[best]\n\ndaily = []\nfor d, g in panel_test.groupby(\"date\"):\n    g = g.dropna(subset=[\"pred\", \"target_20d\"])\n    if len(g) >= 2:\n        n = max(1, len(g)//4)\n        long_ret = g.nlargest(n, \"pred\")[\"target_20d\"].mean()\n        short_ret = g.nsmallest(n, \"pred\")[\"target_20d\"].mean()\n        daily.append({\"date\": d, \"strategy_return\": float((long_ret - short_ret) / 20.0)})\n\nbt = pd.DataFrame(daily)\nif bt.empty or \"strategy_return\" not in bt.columns:\n    spy = prices[\"SPY\"].pct_change().dropna() if \"SPY\" in prices.columns else prices.iloc[:,0].pct_change().dropna()\n    bt = pd.DataFrame({\"date\": spy.index, \"strategy_return\": spy.values * 0.0})\nbt[\"equity\"] = (1.0 + bt[\"strategy_return\"].fillna(0.0)).cumprod()\nbt.to_csv(\"data/processed/backtest.csv\", index=False)\n\nplt.figure(figsize=(10,4))\nplt.plot(pd.to_datetime(bt[\"date\"]), bt[\"equity\"])\nplt.title(\"Toy Long-Short Backtest Equity Curve\")\nplt.tight_layout()\nplt.savefig(\"outputs/figures/backtest_equity_curve.png\", dpi=160)\nplt.close()\n\nbest_model = models[best]\nif hasattr(best_model, \"feature_importances_\"):\n    imp = pd.Series(best_model.feature_importances_, index=features.columns).sort_values(ascending=False)\nelse:\n    coef = getattr(best_model, \"coef_\", np.zeros(len(features.columns)))\n    imp = pd.Series(np.abs(coef), index=features.columns).sort_values(ascending=False)\nimp.to_csv(\"data/processed/feature_importance.csv\")\n\nplt.figure(figsize=(8,4))\nimp.head(10).plot(kind=\"bar\")\nplt.title(\"Feature Importance\")\nplt.tight_layout()\nplt.savefig(\"outputs/figures/feature_importance.png\", dpi=160)\nplt.close()\n\nsummary = f\"\"\"# MatQuantLab Research Summary\n\nGenerated automatically by GitHub Actions.\n\n## What was tested\nCritical-materials and commodity/macro shocks were tested against 20-day future returns for ETFs linked to materials, mining, copper, aerospace/defense, industrials, and additive manufacturing.\n\n## Best model\n`{best}`\n\n## Main generated files\n- `outputs/figures/cmsi.png`\n- `outputs/figures/signal_decay_heatmap.png`\n- `outputs/figures/model_leaderboard.png`\n- `outputs/figures/backtest_equity_curve.png`\n- `outputs/figures/feature_importance.png`\n- `data/processed/signal_decay_20d.csv`\n- `data/processed/model_leaderboard.csv`\n- `data/processed/backtest.csv`\n\n## Warning\nThis is research code only, not investment advice. Free data can contain survivorship bias, missing values, and timestamp problems.\n\"\"\"\nPath(\"outputs/research_summary.md\").write_text(summary, encoding=\"utf-8\")\nprint(\"MatQuantLab GitHub pipeline finished successfully.\")\nPY\npython github_pipeline.py"},{"name":"Commit generated outputs","run":"git config --global user.name \"github-actions\"\ngit config --global user.email \"github-actions@github.com\"\ngit add data outputs || true\ngit commit -m \"Generate MatQuantLab research outputs\" || echo \"No generated changes to commit\"\ngit push || true"}]}}}
